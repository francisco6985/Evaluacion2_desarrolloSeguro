{% extends "base.html" %}

{% load crispy_forms_tags %}


{% block title %}
    Iniciar sesión
{% endblock %}


{% block content %}

<div class="flex min-h-[75vh] items-center justify-center">

    <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">

        <div class="mb-8 text-center">

            <h1 class="text-3xl font-bold text-slate-900">
                Iniciar sesión
            </h1>

            <p class="mt-2 text-sm text-slate-500">
                Ingresa tus credenciales para continuar
            </p>

        </div>


        {% if form.errors %}

            <div class="mb-6 rounded-lg bg-red-50 p-4 text-sm text-red-700">
                Usuario o contraseña incorrectos.
            </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}

            {{ form|crispy }}

            <button
                type="submit"
                class="mt-4 w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700"
            >
                Ingresar
            </button>

        </form>

    </div>

</div>

{% endblock %}
