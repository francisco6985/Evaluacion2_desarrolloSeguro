{% extends "base.html" %}


{% block content %}

<div class="flex justify-center">

    <div class="w-full max-w-lg rounded-2xl bg-white p-8 shadow">

        <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-red-100">

            <span class="text-2xl text-red-600">
                !
            </span>

        </div>

        <h1 class="text-2xl font-bold text-slate-900">
            Eliminar producto
        </h1>

        <p class="mt-3 text-slate-600">

            ¿Estás seguro de eliminar

            <strong class="text-slate-900">
                {{ object.nombre }}
            </strong>?

        </p>

        <p class="mt-2 text-sm text-red-600">
            Esta acción no se puede deshacer.
        </p>


        <form
            method="post"
            class="mt-8 flex justify-end gap-3"
        >

            {% csrf_token %}

            <a
                href="{% url 'producto-list' %}"
                class="rounded-lg border border-slate-300 px-5 py-2.5 font-medium text-slate-700 hover:bg-slate-50"
            >
                Cancelar
            </a>

            <button
                type="submit"
                class="rounded-lg bg-red-600 px-5 py-2.5 font-semibold text-white hover:bg-red-700"
            >
                Sí, eliminar
            </button>

        </form>

    </div>

</div>

{% endblock %}
